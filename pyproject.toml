[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poptrivia"
version = "0.1.0"
description = "Pop-Up Video style trivia for Plex movies, delivered to Discord."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "pysrt>=1.1.2",
    "wikipedia>=1.4.0",
    "playwright>=1.49",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["poptrivia*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
