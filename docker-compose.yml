services:
  poptrivia:
    build: .
    container_name: poptrivia
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      - .env
    volumes:
      # poptrivia's own state (SQLite DB, generated tracks, scraper cache)
      - ./config:/config
      # Mount the media root at the SAME path inside the container so the
      # file paths Tautulli reports work as-is. Read-only — we never write
      # to media.
      - /mnt/user/data/media:/mnt/user/data/media:ro
