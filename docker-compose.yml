services:
  poptrivia:
    # Absolute paths so this works under Unraid Compose Manager (which runs
    # the compose file from its own /boot/... project directory, not from
    # the source tree).
    build: /mnt/user/appdata/poptrivia
    container_name: poptrivia
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      - /mnt/user/appdata/poptrivia/.env
    volumes:
      # poptrivia's own state (SQLite DB, generated tracks, scraper cache)
      - /mnt/user/appdata/poptrivia/config:/config
      # Mount the media root at the SAME path Plex/Tautulli uses so the
      # file paths in webhook payloads resolve as-is. Plex is in a container
      # that maps /mnt/user/data/media -> /data, so we do the same.
      # Read-only — we never write to media.
      - /mnt/user/data/media:/data:ro
